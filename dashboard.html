<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel - Veterinaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark p-3">
    <div class="container-fluid">
        <span class="navbar-brand">Veterinaria</span>
        <div class="navbar-nav">
            <a class="nav-link" href="#" onclick="mostrarVista('vista-mascotas')">Mascotas</a>
            <a class="nav-link" href="#" onclick="mostrarVista('vista-propietarios')">Dueños</a>
            <a class="nav-link" href="#" onclick="mostrarVista('vista-veterinarios')">Veterinarios</a>
            <a class="nav-link text-warning" href="index.html" onclick="localStorage.clear()">Salir</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    
    <div id="vista-mascotas" class="vista">
        <h2>Mascotas</h2>
        <form id="form-mascota" class="row g-2 mb-3">
            <div class="col"><input type="text" id="m-nombre" class="form-control" placeholder="Nombre" required></div>
            <div class="col"><input type="number" id="m-edad" class="form-control" placeholder="Edad" required></div>
            <div class="col"><input type="text" id="m-tipo" class="form-control" placeholder="Tipo" required></div>
            <div class="col"><input type="text" id="m-prop" class="form-control" placeholder="Dueño" required></div>
            <div class="col-auto"><button type="submit" class="btn btn-success">Añadir</button></div>
        </form>
        <table class="table table-hover">
            <thead class="table-dark"><tr><th>Nombre</th><th>Edad</th><th>Tipo</th><th>Dueño</th><th>Acciones</th></tr></thead>
            <tbody id="tabla-mascotas"></tbody>
        </table>
    </div>

    <div id="vista-propietarios" class="vista" style="display: none;">
        <h2>Propietarios</h2>
        <form id="form-propietario" class="row g-2 mb-3">
            <div class="col"><input type="text" id="p-nombre" class="form-control" placeholder="Nombre" required></div>
            <div class="col"><input type="text" id="p-tel" class="form-control" placeholder="Tel" required></div>
            <div class="col"><input type="text" id="p-dir" class="form-control" placeholder="Dirección" required></div>
            <button type="submit" class="btn btn-success col-auto">Añadir</button>
        </form>
        <table class="table table-hover">
            <thead class="table-dark"><tr><th>Nombre</th><th>Tel</th><th>Dir</th><th>Acciones</th></tr></thead>
            <tbody id="tabla-propietarios"></tbody>
        </table>
    </div>

    <div id="vista-veterinarios" class="vista" style="display: none;">
        <h2>Veterinarios</h2>
        <form id="form-veterinario" class="row g-2 mb-3">
            <div class="col"><input type="text" id="v-nombre" class="form-control" placeholder="Nombre" required></div>
            <div class="col"><input type="text" id="v-esp" class="form-control" placeholder="Especialidad" required></div>
            <div class="col"><input type="text" id="v-contacto" class="form-control" placeholder="Contacto" required></div>
            <button type="submit" class="btn btn-success col-auto">Añadir</button>
        </form>
        <table class="table table-hover">
            <thead class="table-dark"><tr><th>Nombre</th><th>Especialidad</th><th>Contacto</th><th>Acciones</th></tr></thead>
            <tbody id="tabla-veterinarios"></tbody>
        </table>
    </div>

</div>

<template id="tpl-fila">
    <tr>
        <td class="col1"></td><td class="col2"></td><td class="col3"></td><td class="col4"></td>
        <td>
            <button class="btn btn-outline-warning btn-sm editar">Editar</button>
            <button class="btn btn-outline-danger btn-sm eliminar">X</button>
        </td>
    </tr>
</template>

<script src="js/app.js"></script>
</body>
</html>
